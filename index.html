<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Modern To-Do List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="work.css">
</head>
<body>
    <div class="app-wrapper">
        <main class="todo-card">
            <!-- Header -->
            <header class="app-header">
                <div class="logo-area">
                    <div class="logo-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 11l3 3L22 4"></path>
                            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path>
                        </svg>
                    </div>
                    <div>
                        <h1>My Tasks</h1>
                        <p class="subtitle" id="taskStats">Keep track of your day</p>
                    </div>
                </div>

                <!-- Theme Toggle Button -->
                <button id="themeToggle" class="theme-toggle-btn" aria-label="Toggle Dark Mode" title="Toggle theme">
                    <span class="theme-icon light-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </span>
                    <span class="theme-icon dark-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </span>
                </button>
            </header>

            <!-- Task Input Section -->
            <form id="todoForm" class="input-section" onsubmit="return false;">
                <div class="input-wrapper">
                    <svg class="search-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off">
                </div>
                <button id="addBtn" type="submit" class="btn-primary">
                    <span>Add Task</span>
                </button>
            </form>

            <!-- Controls: Filters & Actions -->
            <div class="controls-bar">
                <div class="filter-tabs" role="tablist">
                    <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">
                        All <span class="badge" id="countAll">0</span>
                    </button>
                    <button class="filter-btn" data-filter="pending" role="tab" aria-selected="false">
                        Pending <span class="badge" id="countPending">0</span>
                    </button>
                    <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">
                        Completed <span class="badge" id="countCompleted">0</span>
                    </button>
                </div>
                <button id="clearCompletedBtn" class="btn-subtle" title="Clear all completed tasks">
                    Clear Completed
                </button>
            </div>

            <!-- Task List Area -->
            <div class="list-container">
                <ul id="taskList" class="task-list">
                    <!-- Tasks injected by work.js -->
                </ul>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state hidden">
                    <div class="empty-illustration">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                        </svg>
                    </div>
                    <p class="empty-title">No tasks found</p>
                    <p class="empty-desc">Add a task above or select another filter</p>
                </div>
            </div>

            <!-- Footer Stats -->
            <footer class="card-footer">
                <span id="itemsLeftSummary">0 tasks remaining</span>
                <span class="tip">Tip: Double-click or click Edit to modify</span>
            </footer>
        </main>
    </div>

    <script src="work.js"></script>
</body>
</html>
